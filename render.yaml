services:
  - type: web
    name: freelance-client-hub
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: freelance-hub-db
          property: host
      - key: DB_NAME
        fromDatabase:
          name: freelance-hub-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: freelance-hub-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: freelance-hub-db
          property: password
      - key: APP_SECRET
        generateValue: true

databases:
  - name: freelance-hub-db
    plan: free
